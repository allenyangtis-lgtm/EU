<style>
  :root{

  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans TC',-apple-system,sans-serif; display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; padding-bottom:56px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px; }
  .back-btn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink); }
  .title-pill{ font-size:15px; font-weight:700; color:var(--ink); }

  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{ flex:0 0 auto; font-size:14.5px; font-weight:600; color:var(--ink-dim2); padding-bottom:8px; white-space:nowrap; position:relative; }
  .day-tab.active{ color:var(--ink); }
  .day-tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px; }

  .day-head{ padding:16px 18px 4px; }
  .day-title{ font-size:19px; font-weight:700; color:var(--ink); line-height:1.4; }
  .day-sub{ font-size:12.5px; color:var(--ink-dim2); margin-top:2px; }
  .banner{ margin:10px 18px 4px; background:#FFF6E5; border:1px solid #F0DBA6; border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.6; color:#8A6D2E; }

  .timeline{ padding:14px 18px 0; }

  .card-wrap{ position:relative; margin-bottom:4px; }
  .card{
    display:flex; gap:12px; background:var(--card); border-radius:16px; padding:10px; position:relative;
  }
  .card.gold{ background:var(--card-gold); }

  .thumb{
    flex:0 0 96px; width:96px; height:96px; border-radius:12px; overflow:hidden; position:relative;
    background:#E4E7EC; border:1.5px dashed #C7CCD4; display:flex; align-items:center; justify-content:center;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .placeholder-icon{ font-size:26px; color:#AEB4BD; }
  .flag-num{
    position:absolute; top:8px; left:0; background:var(--blue); color:#fff; font-weight:700; font-size:13px;
    padding:2px 9px 2px 8px; border-radius:0 6px 6px 0; line-height:1.5;
    clip-path:polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%);
  }

  .card-body{ flex:1; min-width:0; padding:4px 30px 4px 2px; position:relative; }
  .time-row{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .cam-icon{ color:var(--blue); font-size:13px; }
  .time-text{ color:var(--blue); font-weight:700; font-size:14.5px; }
  .badge-gray{ background:#E7EAEE; color:var(--ink-dim); font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; }

  .stop-title{ font-size:16px; font-weight:700; color:var(--ink); line-height:1.4; text-decoration:none; display:block; margin-bottom:3px; }
  a.stop-title:active{ opacity:0.7; }
  .stop-meta{ font-size:12px; color:var(--ink-dim); line-height:1.6; }
  .stop-note{ font-size:12px; color:var(--ink-dim); margin-top:2px; line-height:1.6; }
  .ref-link{ display:inline-flex; align-items:center; gap:4px; margin-top:4px; font-size:11.5px; color:var(--blue); text-decoration:none; }

  .nav-circle{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--ink-dim);
  }

  .connector{
    display:flex; align-items:center; gap:6px; padding:8px 0 8px 46px; position:relative;
  }
  .connector::before{
    content:''; position:absolute; left:57px; top:-4px; bottom:-4px; width:0; border-left:2px dotted #C7CCD4;
  }
  .connector .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-dim); font-weight:600;
    background:#fff; border:1px solid var(--line); padding:4px 10px; border-radius:999px; position:relative; z-index:1;
  }

  footer{ text-align:center; padding:36px 20px 8px; color:var(--ink-dim2); font-size:12px; }
</style>

let currentIdx = 0;
function render(){
  const day = DAYS[currentIdx];
  const app = document.getElementById('app');
  const tabsHtml = DAYS.map((d,i)=>`<div class="day-tab ${i===currentIdx?'active':''}" data-idx="${i}">${d.date}</div>`).join('');
  const bannerHtml = day.banner ? `<div class="banner">ℹ️ ${day.banner}</div>` : '';

  let itemsHtml = '';
  let stopNum = 1;
  day.items.forEach((it)=>{
    if(it.travel){
      const parts = it.travel.split(' ');
      itemsHtml += `<div class="connector"><span class="pill">${it.travel} ›</span></div>`;
      return;
    }
    const titleInner = it.map
      ? `<a class="stop-title" href="${it.map}" target="_blank" rel="noreferrer">${it.title}</a>`
      : `<div class="stop-title">${it.title}</div>`;
    const metaBits = [];
    if(it.stay) metaBits.push(it.stay);
    if(it.note) metaBits.push('有筆記');
    const metaHtml = metaBits.length ? `<div class="stop-meta">${metaBits.join(' · ')}</div>` : '';
    const noteHtml = (it.note && !it.stay) ? `<div class="stop-note">${it.note}</div>` : (it.note ? `<div class="stop-note">${it.note}</div>` : '');
    const refHtml = it.ref ? `<a href="${it.ref}" target="_blank" rel="noreferrer" class="ref-link">📖 參考資料</a>` : '';

    const thumbInner = it.photo
      ? `<img src="${it.photo}" alt="${it.title}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=placeholder-icon>🖼️</span>';">`
      : `<span class="placeholder-icon">🖼️</span>`;

    itemsHtml += `
      <div class="card-wrap">
        <div class="card ${it.highlight?'gold':''}">
          <div class="thumb">
            ${thumbInner}
            <span class="flag-num">${stopNum}</span>
          </div>
          <div class="card-body">
            <div class="time-row">
              <span class="cam-icon">📷</span>
              <span class="time-text">${it.time}</span>
            </div>
            ${titleInner}
            ${metaHtml}
            ${noteHtml}
            ${refHtml}
          </div>
          <div class="nav-circle">➤</div>
        </div>
      </div>`;
    stopNum++;
  });

  app.innerHTML = `
    <div class="topbar">
      <div class="back-btn">‹</div>
      <div class="title-pill">德捷奧自由行</div>
      <div class="icon-btn">⚙️</div>
    </div>
    <div class="day-tabs">${tabsHtml}</div>
    <div class="day-head">
      <div class="day-title">${day.day} ${day.date}（${day.weekday}）${day.title}</div>
      ${bannerHtml}
    </div>
    <div class="timeline">${itemsHtml}</div>
  `;
  document.querySelectorAll('.day-tab').forEach(btn=>{
    btn.onclick = ()=>{ currentIdx = parseInt(btn.dataset.idx); render(); window.scrollTo(0,0); };
  });
}
render();
</script>
